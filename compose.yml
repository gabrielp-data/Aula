services:
  treino:
    build: .
    volumes:
      - ./src:/app/src         # edita local, roda no container
      - ./data:/app/data       # dado via bind mount (sem rebuild)
      - ./artifacts:/app/artifacts
    command: uv run python -m churn.model

  grid:
    build: .
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./mlruns:/app/mlruns
    command: uv run python -m churn.experiments

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./artifacts:/app/artifacts
    command: uv run uvicorn churn.app:app --host 0.0.0.0 --port 8000
